            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Проверить сессию
      tags:
      - sessions
  /api/v2/sub/UploadImg:
    post:
      consumes:
      - multipart/form-data
      description: Загружает фотографию в хранилище и возвращает ссылку. Эту ссылку
        затем можно использовать для создания или обновления данных сущности (например,
        группы).
      parameters:
      - description: Изображение для загрузки (JPG, PNG, максимум 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: URL загруженного изображения
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Файл не предоставлен, имеет неверный тип или размер
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Загрузка фотографии
      tags:
      - sub_func
  /api/v2/user/me:
    get:
      description: Возвращает актуальные данные профиля, которые не хранятся в access-токене.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AuthMeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить текущего пользователя
      tags:
      - users
  /api/v2/users/me/groups/managed:
    get:
      description: Возвращает группы текущего пользователя, разделённые на блоки администратора
        и модератора
      produces:
      - application/json
      responses:
        "200":
          description: Группы текущего пользователя по ролям
          schema:
            $ref: '#/definitions/dto.ManagedGroupsDto'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить группы, где пользователь админ или модератор
      tags:
      - users
  /api/v2/users/me/groups/subscriptions:
    get:
      description: Возвращает страницу групп, где текущий пользователь состоит с ролью
        обычного участника. Группы, где пользователь администратор или модератор,
        не включаются.
      parameters:
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Размер страницы
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Подписки текущего пользователя на группы
          schema:
            $ref: '#/definitions/dto.SubscribedGroupsResponseDto'
        "400":
          description: Некорректные параметры пагинации
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Не авторизован
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить подписки пользователя на группы
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'Введите токен в формате: Bearer <your_token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
