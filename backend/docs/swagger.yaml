  /api/v2/events/search:
    get:
      description: |-
        Публичный поиск событий с фильтрами, исключениями и пагинацией. События приватных групп видны только участникам этих групп. Если передать JWT, дополнительно доступны события приватных групп пользователя и режим feed=subscription_news.
        Поддерживаются алиасы query: q/query, categoryIds/categoryId/categories, genreIds/genreId/genres, pageSize/limit, dateFrom/from, dateTo/to, locationType/locationTypes/type, excludeLocationType/excludeLocationTypes/excludeType, feed=subscription_news/subscription-news/новинки подписок.
      parameters:
      - description: Поиск по названию/описанию события и названию группы
        in: query
        name: q
        type: string
      - description: ID группы
        in: query
        name: groupId
        type: integer
      - collectionFormat: csv
        description: ID категорий групп, повтором или CSV
        in: query
        items:
          type: integer
        name: categoryIds
        type: array
      - collectionFormat: csv
        description: ID категорий групп для исключения, повтором или CSV
        in: query
        items:
          type: integer
        name: excludeCategoryIds
        type: array
      - collectionFormat: csv
        description: ID жанров, повтором или CSV
        in: query
        items:
          type: integer
        name: genreIds
        type: array
      - collectionFormat: csv
        description: ID жанров для исключения, повтором или CSV
        in: query
        items:
          type: integer
        name: excludeGenreIds
        type: array
      - collectionFormat: csv
        description: ID типов событий, повтором или CSV
        in: query
        items:
          type: integer
        name: eventTypeIds
        type: array
      - collectionFormat: csv
        description: ID типов событий для исключения, повтором или CSV
        in: query
        items:
          type: integer
        name: excludeEventTypeIds
        type: array
      - description: online/offline
        in: query
        name: locationType
        type: string
      - description: online/offline для исключения
        in: query
        name: excludeLocationType
        type: string
      - description: Город проведения
        in: query
        name: city
        type: string
      - description: Дата/время начала от, RFC3339 или YYYY-MM-DD
        in: query
        name: dateFrom
        type: string
      - description: Дата/время начала до, RFC3339 или YYYY-MM-DD
        in: query
        name: dateTo
        type: string
      - description: true - только со свободными местами, false - только заполненные
        in: query
        name: hasFreeSlots
        type: boolean
      - description: Страница, по умолчанию 1
        in: query
        name: page
        type: integer
      - description: Размер страницы, по умолчанию 20, максимум 100
        in: query
        name: limit
        type: integer
      - description: subscription_news для новинок подписок
        in: query
        name: feed
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Страница событий
          schema:
            $ref: '#/definitions/dto.EventSearchResponse'
        "400":
          description: Некорректные параметры поиска
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Поиск событий
      tags:
      - events
